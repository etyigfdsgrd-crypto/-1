<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад МППК | Cyberpunk Neon Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#08090f',
                            card: '#101423',
                            panel: '#161b30',
                            border: '#212946',
                            cyan: '#00f0ff',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08090f;
            /* Шлях відносний (./) гарантує зчитування файлу в цій же папці */
            background-image: 
                linear-gradient(rgba(8, 9, 15, 0.85), rgba(8, 9, 15, 0.85)),
                url('./image_ed85be.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
        }

        .neon-border-cyan {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.5);
        }

        .neon-border-pink {
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3), inset 0 0 10px rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.5);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.4);
        }

        .neon-text-purple {
            text-shadow: 0 0 8px rgba(157, 0, 255, 0.7), 0 0 20px rgba(157, 0, 255, 0.4);
        }

        .glass-panel {
            background: rgba(16, 20, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(22, 27, 48, 0.7);
            backdrop-filter: blur(8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 8px 25px -5px rgba(0, 240, 255, 0.25);
        }

        /* Cyberpunk scanlines effect overlay */
        .scanline-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #08090f;
        }
        ::-webkit-scrollbar-thumb {
            background: #212946;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
        }

        .active-day-tab {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(157, 0, 255, 0.2));
            border-bottom: 2px solid #00f0ff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .practice-glow {
            border: 1px solid #ffcc00 !important;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
            background: rgba(255, 204, 0, 0.07) !important;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden pb-12">
    <div class="fixed inset-0 scanline-overlay z-50 pointer-events-none opacity-40"></div>

    <header class="border-b border-cyber-border bg-cyber-bg/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyber-cyan via-cyber-purple to-cyber-pink p-[2px] flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                    <div class="w-full h-full bg-cyber-bg rounded-[6px] flex items-center justify-center">
                        <i class="fa-solid font-bold text-cyber-cyan text-lg fa-graduation-cap"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-orbitron font-bold text-xl sm:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan via-white to-cyber-pink tracking-wider">
                        МППК <span class="text-xs uppercase px-2 py-0.5 rounded bg-cyber-purple/30 border border-cyber-purple text-cyber-cyan font-sans ml-1">Cyber Schedule</span>
                    </h1>
                    <p class="text-xs text-gray-400 font-rajdhani tracking-widest uppercase">Мукачівський Професійний Політехнічний Коледж</p>
                </div>
            </div>

            <!-- Header Controls: Search & Date Status -->
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Пошук предмета чи кабінету..." 
                        class="w-full bg-cyber-card border border-cyber-border rounded-lg pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan transition-all text-gray-200 placeholder-gray-500">
                </div>
                
                <button id="todayBtn" class="px-3 py-1.5 rounded-lg bg-cyber-purple/20 border border-cyber-purple text-cyber-cyan text-sm font-semibold hover:bg-cyber-purple/40 transition-all flex items-center gap-2 shadow-[0_0_10px_rgba(157,0,255,0.2)]">
                    <i class="fa-solid fa-calendar-day"></i> <span class="hidden sm:inline">Сьогодні</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        
        <section class="mb-6">
            <div class="flex items-center justify-between mb-2">
                <h2 class="font-orbitron text-sm uppercase text-cyber-cyan tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-users text-xs"></i> Виберіть навчальну групу
                </h2>
                <span id="groupCountBadge" class="text-xs text-gray-400 font-mono">24 групи</span>
            </div>

            <!-- Group Chips Carousel -->
            <div class="glass-panel p-3 rounded-xl shadow-lg border border-cyber-border">
                <div id="groupPillsContainer" class="flex items-center gap-2 overflow-x-auto pb-2 pt-1 scrollbar-thin">
                    <!-- Dynamic rendering of group pills -->
                </div>
            </div>
        </section>

        <section class="glass-panel p-4 rounded-xl mb-6 border border-cyber-border flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-cyber-cyan/10 border border-cyber-cyan/40 flex items-center justify-center text-cyber-cyan font-orbitron text-xl font-bold neon-border-cyan">
                    <span id="selectedGroupTitle">КР-10</span>
                </div>
                <div>
                    <h3 class="font-orbitron text-lg text-white font-bold tracking-wide flex items-center gap-2">
                        Група <span id="currentGroupHeader" class="text-cyber-cyan">КР-10</span>
                    </h3>
                    <p class="text-xs text-gray-400" id="scheduleStatusText">Розклад занять на тиждень (Понеділок - П'ятниця)</p>
                </div>
            </div>

            <!-- Day Selector Tabs -->
            <div class="flex items-center gap-1 bg-cyber-bg/80 p-1 rounded-lg border border-cyber-border overflow-x-auto max-w-full" id="dayTabsContainer">
                <button data-day="all" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider transition-all active-day-tab">Весь тиждень</button>
                <button data-day="Mon" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-white transition-all">Пн</button>
                <button data-day="Tue" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-white transition-all">Вт</button>
                <button data-day="Wed" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-white transition-all">Ср</button>
                <button data-day="Thu" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-white transition-all">Чт</button>
                <button data-day="Fri" class="day-tab px-3 py-1.5 rounded-md text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-white transition-all">Пт</button>
            </div>
        </section>

        <section id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Dynamic Schedule Columns for Monday-Friday -->
        </section>

        <!-- Search Results Panel (Hidden by default) -->
        <section id="searchResultsSection" class="hidden">
            <div class="glass-panel p-4 rounded-xl border border-cyber-cyan/40 mb-4">
                <h3 class="font-orbitron text-md text-cyber-cyan mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Результати пошуку: <span id="searchQueryTerm" class="text-white"></span>
                </h3>
                <div id="searchResultsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <!-- Search items rendered here -->
                </div>
            </div>
        </section>

    </main>

        const DAYS_MAP = {
            "Mon": "Понеділок",

        const groupPillsContainer = document.getElementById('groupPillsContainer');
        const scheduleGrid = document.getElementById('scheduleGrid');
        const selectedGroupTitle = document.getElementById('selectedGroupTitle');
        const currentGroupHeader = document.getElementById('currentGroupHeader');
        const searchInput = document.getElementById('searchInput');

        const searchResultsList = document.getElementById('searchResultsList');
        const searchQueryTerm = document.getElementById('searchQueryTerm');
        const todayBtn = document.getElementById('todayBtn');

        function initApp() {
            renderGroupPills();
            renderSchedule();

            // Setup Search Listener
            searchInput.addEventListener('input', handleSearch);

            // Day Tab Controls
            document.querySelectorAll('.day-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active-day-tab'));
                    tab.classList.add('active-day-tab');
                    currentDayFilter = tab.getAttribute('data-day');
                    renderSchedule();
                });
            });

            // Today Button Click
            todayBtn.addEventListener('click', () => {
                const jsDay = new Date().getDay();
                const dayKeys = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                const todayKey = dayKeys[jsDay];

                if (["Mon", "Tue", "Wed", "Thu", "Fri"].includes(todayKey)) {
                    currentDayFilter = todayKey;
                    document.querySelectorAll('.day-tab').forEach(t => {
                        if (t.getAttribute('data-day') === todayKey) {
                            t.click();
                        }
                    });
                } else {
                    currentDayFilter = "Mon";
                    document.querySelector('[data-day="Mon"]').click();
                }
            });
        }

        // Render Group Chips
        function renderGroupPills() {
            groupPillsContainer.innerHTML = '';
            Object.keys(SCHEDULE_DATA).forEach(group => {
                const isSelected = group === currentGroup;
                const button = document.createElement('button');
                button.className = `px-3 py-1.5 rounded-lg font-orbitron text-xs tracking-wider transition-all whitespace-nowrap ${
                    isSelected 
                        ? 'bg-cyber-cyan text-cyber-bg font-bold shadow-[0_0_12px_rgba(0,240,255,0.6)] scale-105' 
                        : 'bg-cyber-card border border-cyber-border text-gray-300 hover:border-cyber-cyan hover:text-white'
                }`;
                button.textContent = group;
                button.onclick = () => {
                    currentGroup = group;
                    selectedGroupTitle.textContent = group;
                    currentGroupHeader.textContent = group;
                    renderGroupPills();
                    renderSchedule();
                };
                groupPillsContainer.appendChild(button);
            });
        }

        function renderSchedule() {
            scheduleGrid.innerHTML = '';
            searchResultsSection.classList.add('hidden');
            scheduleGrid.classList.remove('hidden');

            const groupSchedule = SCHEDULE_DATA[currentGroup] || {};
            const daysToDisplay = currentDayFilter === 'all' ? ["Mon", "Tue", "Wed", "Thu", "Fri"] : [currentDayFilter];

            daysToDisplay.forEach(dayKey => {
                const dayName = DAYS_MAP[dayKey];
                const dayData = groupSchedule[dayKey] || {};

                const dayColumn = document.createElement('div');
                dayColumn.className = 'glass-panel rounded-xl overflow-hidden border border-cyber-border flex flex-col h-full';

                const jsDay = new Date().getDay();
                const dayMapJs = {1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri"};
                const isToday = dayMapJs[jsDay] === dayKey;

                dayColumn.innerHTML = `
                    <div class="px-4 py-2.5 bg-cyber-panel/90 border-b border-cyber-border flex items-center justify-between ${isToday ? 'bg-gradient-to-r from-cyber-cyan/20 to-cyber-purple/20 border-cyber-cyan/50' : ''}">

                            <i class="fa-solid fa-calendar-day text-xs ${isToday ? 'text-cyber-cyan animate-pulse' : 'text-gray-400'}"></i>
                            <span class="font-orbitron font-bold text-sm tracking-wide ${isToday ? 'text-cyber-cyan neon-text-cyan' : 'text-white'}">${dayName}</span>
                        </div>
                        ${isToday ? '<span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-cyber-cyan text-cyber-bg">Сьогодні</span>' : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col gap-2.5">
                        ${renderDayLessons(dayData)}
                    </div>
                `;

                scheduleGrid.appendChild(dayColumn);
            });
        }

        function renderDayLessons(dayData) {

                    hasLessons = true;
                    const [subject, cab] = dayData[i];
                    const isPractice = subject.toLowerCase().includes('виробнич') || subject.toLowerCase().includes('практика');

                    html += `
                        <div class="glass-card p-2.5 rounded-lg border border-cyber-border hover:border-cyber-cyan/50 flex items-center justify-between gap-2 group transition-all">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="w-7 h-7 rounded-md bg-cyber-bg border border-cyber-border group-hover:border-cyber-cyan/40 flex items-center justify-center font-orbitron text-xs text-cyber-cyan font-bold flex-shrink-0">
                                    ${i}
                                </div>
                                <div class="min-w-0">
                                    <p class="text-xs font-semibold text-gray-200 group-hover:text-cyber-cyan transition-colors truncate" title="${subject}">
                                        ${subject}
                                    </p>
                                    ${isPractice ? '<span class="text-[10px] text-cyber-yellow flex items-center gap-1"><i class="fa-solid fa-gear text-[9px]"></i> Практика</span>' : ''}
                                </div>
                            </div>
                            ${cab ? `
                                <div class="flex-shrink-0">
                                    <span class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-cyber-purple/20 text-cyber-cyan border border-cyber-purple/40 shadow-[0_0_8px_rgba(157,0,255,0.2)]">
                                        каб. ${cab}
                                    </span>
                                </div>
                            ` : `
                                <span class="text-[10px] text-gray-500 italic">спортзал</span>
                            `}
                        </div>
                    `;
                }
            }

            if (!hasLessons) {
                html = `
                    <div class="flex flex-col items-center justify-center h-full py-8 text-gray-500 text-xs">
                        <i class="fa-solid fa-mug-hot text-2xl mb-1 text-gray-600"></i>
                        <span>Немає занять</span>
                    </div>
                `;
            }

            return html;
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();

            if (query.length < 2) {
                searchResultsSection.classList.add('hidden');
                scheduleGrid.classList.remove('hidden');
                return;
            }

            scheduleGrid.classList.add('hidden');
            searchResultsSection.classList.remove('hidden');
            searchQueryTerm.textContent = `"${query}"`;
            searchResultsList.innerHTML = '';

            let resultsFound = 0;

            Object.entries(SCHEDULE_DATA).forEach(([groupName, groupData]) => {
                Object.entries(groupData).forEach(([dayKey, dayLessons]) => {
                    Object.entries(dayLessons).forEach(([lessonNum, lessonInfo]) => {
                        const [subject, cab] = lessonInfo;
                        if (subject.toLowerCase().includes(query) || (cab && cab.toLowerCase().includes(query))) {
                            resultsFound++;
                            const resultCard = document.createElement('div');
                            resultCard.className = 'glass-card p-3 rounded-xl border border-cyber-border hover:border-cyber-cyan transition-all flex flex-col justify-between';
                            resultCard.innerHTML = `
                                <div class="flex items-center justify-between mb-2">
                                    <span class="px-2 py-0.5 rounded text-xs font-orbitron font-bold bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40">${groupName}</span>
                                    <span class="text-xs text-gray-400"><i class="fa-solid fa-calendar text-[10px] mr-1"></i>${DAYS_MAP[dayKey]} (${lessonNum} пара)</span>
                                </div>
                                <h4 class="font-semibold text-sm text-white mb-2">${subject}</h4>
                                <div class="flex items-center justify-between text-xs text-gray-400 border-t border-cyber-border/50 pt-2">
                                    <span>Кабінет:</span>
                                    <span class="font-mono text-cyber-cyan font-bold">${cab ? 'каб. ' + cab : 'Спортзал / Інше'}</span>
                                </div>
                            `;
                            resultCard.onclick = () => {
                                currentGroup = groupName;
                                selectedGroupTitle.textContent = groupName;
                                currentGroupHeader.textContent = groupName;
                                searchInput.value = '';
                                renderGroupPills();
                                renderSchedule();
                            };
                            searchResultsList.appendChild(resultCard);
                        }
                    });
                });
            });

            if (resultsFound === 0) {
                searchResultsList.innerHTML = `
                    <div class="col-span-full py-8 text-center text-gray-400">
                        <i class="fa-solid fa-magnifying-glass-minus text-3xl mb-2 text-cyber-pink"></i>
                        <p>За вашим запитом предметів чи кабінетів не знайдено.</p>
                    </div>
                `;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
